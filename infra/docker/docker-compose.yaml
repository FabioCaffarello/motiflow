services:
  minio:
    restart: always
    image: minio/minio
    platform: linux/amd64
    container_name: minio_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - motiflow-network
  mc:
    image: minio/mc
    platform: linux/amd64
    depends_on:
      - minio
    container_name: mc
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c " /tmp/wait-for-it.sh minio:9000 && /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} && /usr/bin/mc mb minio/motiflow; exit 0; "
    volumes:
      - ./scripts/wait-for-it.sh:/tmp/wait-for-it.sh
    networks:
      - motiflow-network

  spark-connect:
    build:
      context: ./images/spark
      dockerfile: Dockerfile
    container_name: spark-connect
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,org.apache.hadoop:hadoop-aws:3.3.6,com.amazonaws:aws-java-sdk-bundle:1.12.262,com.mysql:mysql-connector-j:8.0.33
      - --conf
      - spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      - --conf
      - spark.hadoop.fs.s3a.access.key=${MINIO_ACCESS_KEY}
      - --conf
      - spark.hadoop.fs.s3a.secret.key=${MINIO_SECRET_KEY}
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "15002:15002"
      - "4040-4045:4040-4045"
    volumes:
      - spark-warehouse:/opt/spark/warehouse
      - spark-checkpoints:/tmp/spark-checkpoints
      - ../../datasets-examples:/opt/spark/examples:ro
    depends_on:
      - minio
    networks:
      - motiflow-network

  motia-flows:
    image: fabiocaffarello/motia-flows:latest
    container_name: motia-flows
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MOTIA_DOCKER=true
    volumes:
      # Mount datasets for analysis
      - ../../datasets-examples:/app/datasets-examples:ro
    depends_on:
      - spark-connect
      - minio
    networks:
      - motiflow-network
    restart: unless-stopped

  motia-bridge:
    image: fabiocaffarello/motia-bridge:latest
    container_name: motia-bridge
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.next
    depends_on:
      - motia-flows
      - minio
    networks:
      - motiflow-network
    restart: unless-stopped

  synthetic-data-generator:
    build:
      context: ../..
      dockerfile: infra/docker/images/synthetic-data-generator/Dockerfile
    container_name: synthetic-data-generator
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      # Mount config directory
      - ../../synthetic-data-generator/examples:/app/config:ro
      # Mount output directory (writable)
      - synthetic-data-output:/app/output
      # Mount data directory for test datasets
      - ../../datasets-examples:/app/data:ro
    networks:
      - motiflow-network
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    # Keep container running
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/syngen", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  synthetic-data-generator-dev:
    build:
      context: ../..
      dockerfile: infra/docker/images/synthetic-data-generator/Dockerfile.dev
    container_name: synthetic-data-generator-dev
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=full
    volumes:
      # Mount entire source for live development
      - ../../synthetic-data-generator:/app/synthetic-data-generator
      # Mount config and output
      - ../../synthetic-data-generator/examples:/app/config:ro
      - synthetic-data-output:/app/output
      - ../../datasets-examples:/app/data:ro
    networks:
      - motiflow-network
    profiles:
      - dev
    # Can be used for interactive development
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    container_name: motiflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motiflow123}
      POSTGRES_DB: ${POSTGRES_DB:-motiflow_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - motiflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  motiflow-dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/images/motiflow-dashboard/Dockerfile.dev
    container_name: motiflow-dashboard
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-motiflow}:${POSTGRES_PASSWORD:-motiflow123}@postgres:5432/${POSTGRES_DB:-motiflow_dashboard}
      - NEXT_PUBLIC_APP_URL=http://localhost:5001
    volumes:
      # Mount source code for hot-reload
      - ../../web/motiflow-dashboard:/app
      # Exclude node_modules and .next to use container's versions
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motiflow-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  minio-data:
  spark-warehouse:
  spark-checkpoints:
  conf:
  synthetic-data-output:
  postgres-data:

networks:
  motiflow-network:
    name: motiflow-network
    driver: bridge
