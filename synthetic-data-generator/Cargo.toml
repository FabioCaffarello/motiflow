[workspace]
members = [
    "core",
    "infrastructure", 
    "application",
    "cli"
]
resolver = "2"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0"

# Error handling
anyhow = "1.0.89"
thiserror = "2.0.17"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
rand = "0.9.2"
rand_chacha = "0.9.0"

# Performance
rayon = "1.10"
crossbeam = "0.8.4"
parking_lot = "0.12.3"

# NUMA and SIMD
libc = "0.2.158"
memmap2 = "0.9.5"

# Development dependencies
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = "1.5"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true