[package]
name = "synthetic_data_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Team <team@company.com>"]
description = "Domain and application layer for synthetic data generator"

[dependencies]
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
num_cpus = "1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
proptest = { workspace = true }
