services:
  # Development environment with hot-reload
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        - BUILDKIT_INLINE_CACHE=1
    user: "1001:1001"  # Same as dev user in container
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/home/dev/.cargo/registry:cached
      - target-cache:/workspace/target:cached
    working_dir: /workspace
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - CARGO_INCREMENTAL=1
      - HOME=/home/dev
    ports:
      - "8080:8080"  # Future API port
      - "9090:9090"  # Metrics port
    stdin_open: true
    tty: true
    command: ["bash"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cargo", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production-like testing environment
  prod-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    volumes:
      - ../examples:/examples:ro
    environment:
      - RUST_LOG=info
    command: ["--help"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

  # Benchmarking environment  
  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry:cached
      - target-cache:/workspace/target:cached
      - benchmark-results:/workspace/target/criterion:rw
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - CARGO_INCREMENTAL=0
    command: ["cargo", "bench", "--workspace"]
    profiles:
      - benchmark
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0' 
          memory: 2G

  # CI/CD testing environment
  ci:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        - BUILDKIT_INLINE_CACHE=1
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry:cached
    working_dir: /workspace
    environment:
      - RUST_LOG=warn
      - CARGO_INCREMENTAL=0
      - CARGO_NET_RETRY=10
    command: >
      bash -c "
        set -euo pipefail &&
        echo '🔍 Checking code formatting...' &&
        cargo fmt --all -- --check &&
        echo '🧹 Running clippy lints...' &&
        cargo clippy --all-targets --all-features -- -D warnings &&
        echo '🧪 Running tests...' &&
        cargo test --workspace --all-features --verbose &&
        echo '🏗️ Building release...' &&
        cargo build --release --workspace &&
        echo '✅ All checks passed!'
      "
    profiles:
      - ci
    deploy:
      resources:
        limits:
          memory: 2G
    restart: "no"

  # Security scanning environment
  security:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry:cached
    working_dir: /workspace
    command: >
      bash -c "
        cargo audit &&
        cargo outdated --exit-code 1
      "
    profiles:
      - security

volumes:
  cargo-cache:
    driver: local
  target-cache: 
    driver: local
  benchmark-results:
    driver: local

networks:
  default:
    name: synthetic-data-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16